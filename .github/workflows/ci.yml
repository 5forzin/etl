name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Check Azure enrollment script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $etlErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/enroll-azure.ps1", [ref]$null, [ref]$etlErrors) | Out-Null
          if ($etlErrors.Count) { $etlErrors; exit 1 }
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t etl:test .
      - run: docker run --rm etl:test --help
      - run: bash -n deploy/bootstrap.sh deploy/renew-certificate.sh
