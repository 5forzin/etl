name: External network diagnostics

# Manual probe from a GitHub-hosted runner: verifies that the deployed lab
# answers on its public port from an outside network. Sends no credentials.
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to probe (pass your own deployed hostname)
        required: true
      port:
        description: TCP port to probe
        required: true
        default: "443"

permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify DNS, TCP and TLS identity without credentials
        env:
          ETL_HOST: ${{ inputs.host }}
          ETL_PORT: ${{ inputs.port }}
        run: node src/cli.js doctor --server "$ETL_HOST" --server-port "$ETL_PORT" --timeout 15000 --json
